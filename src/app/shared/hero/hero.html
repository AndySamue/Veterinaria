<section class="lg:grid lg:h-screen lg:place-content-center">
    <div
        class="mx-auto w-screen max-w-7xl px-4 py-16 sm:px-6 sm:py-24 md:grid md:grid-cols-2 md:items-center md:gap-10 lg:px-8 lg:py-32">

        <!-- Texto -->
        <div class="max-w-prose text-left">
            <h1 class="text-4xl font-extrabold text-gray-900 sm:text-5xl leading-tight">
                {{titulo}}
            </h1>

            <p class="mt-6 text-base text-gray-700 sm:text-lg/relaxed">
                {{subtitulo}}
            </p>

            <div class="mt-6 flex flex-wrap gap-4">
                <a class="inline-block rounded-lg bg-emerald-600 px-6 py-3 font-semibold text-white shadow-md transition hover:bg-emerald-700 hover:shadow-lg"
                    href="#">
                    {{textoBoton}}
                </a>

                <a class="inline-block rounded-lg border border-emerald-200 bg-white px-6 py-3 font-semibold text-emerald-700 shadow-sm transition hover:bg-emerald-100 hover:text-emerald-900"
                    href="#">
                    {{textoBoton}}
                </a>
            </div>
        </div>

        <!-- Imagen -->
        <div class="mt-12 md:mt-0 flex justify-center">
            <img class="w-full max-w-sm md:max-w-md lg:max-w-lg h-auto max-h-96 rounded-2xl shadow-xl transition-transform duration-300 hover:scale-105 object-cover"
                [src]="imagen" alt="Imagen Perro" />
        </div>

    </div>
</section>
