<!-- clases Tailwind -->
<div class="p-8">
    <h1 class="text-2xl font-bold mb-4">Panel de Internados</h1>

    <div class="mb-6">
        <label for="buscar" class="block text-sm font-medium">Buscar Paciente</label>
        <input [(ngModel)]="filtro" type="text" placeholder="buscar paciente" class="border p-2 rounded w-full md:w-64">
        <p class="mt-2 text-gray-800">
            Buscando:{{filtro}}
            <span class="font-bold text-indigo-800"></span>
        </p>
    </div>

    <!-- GRID para pacientes -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        @for (internado of internados; track internado.nombre) {
        <div class="border p-4 rounded-xl shadow-sm bg-amber-50">
            <h3 class="text-lg font-bold">
                {{internado.nombre}}
            </h3>
            <p class="text-sm mb-2 uppercase font-bold text-gray-700" [ngClass]="{
                    'text-red-600': internado.urgencia === 'Alta',
                    'text-yellow-400': internado.urgencia === 'Media',
                    'text-green-600': internado.urgencia === 'Baja'
                }">
                Prioridad: {{internado.urgencia}}
            </p>

            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-1">
                <div class="bg-emerald-200 h-2.5 rounded-full"
                    [ngStyle]="{'width': internado.progreso + '%'}"
                >

                </div>
            </div>

            <span class="text-xs text-gray-500">
                Recuperación: {{internado.progreso}}%
            </span>
        </div>
        }
    </div>
</div>
