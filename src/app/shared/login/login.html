<form (ngSubmit)="iniciarSesion()" class="max-w-sm mx-auto">
    <div class="mb-5">
        <label for="email-alternative" class="block mb-2.5 text-sm font-medium text-heading">Email</label>
        <input [(ngModel)]="email" type="email" id="email-alternative" name="email"
            class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow placeholder:text-body"
            placeholder="name@flowbite.com" required />
    </div>
    <div class="mb-5">
        <label for="password-alternative" class="block mb-2.5 text-sm font-medium text-heading">Contraseña</label>
        <input [(ngModel)]="password" type="password" id="password-alternative" name="password"
            class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow placeholder:text-body"
            placeholder="••••••••" required />
    </div>
    <button type="submit"
        class="text-dark bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Iniciar
        Sesión</button>
    <button (click)="cerrarSesion()" type="button"
        class="text-dark bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Cerrar
        Sesión</button>
</form>
