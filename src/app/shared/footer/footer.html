<footer class="bg-white">
    <div class="mx-auto max-w-7xl space-y-8 px-4 py-16 sm:px-6 lg:space-y-16 lg:px-8">

        <div class="sm:flex sm:items-center sm:justify-between">
            <div class="text-teal-600">
                <a href="#" class="flex items-center gap-3">
                    <img [src]="logoUrl" class="h-8" alt="Veterinaria Logo" />
                    <span class="text-xl font-bold tracking-wide">
                        Patitas
                    </span>
                </a>
            </div>

            <ul class="mt-8 flex justify-start gap-6 sm:mt-0 sm:justify-end">
                <li>
                    <a href="#" class="text-[#1877F2] transition hover:opacity-75">
                        <span class="sr-only">Facebook</span>
                        <svg class="size-6" fill="currentColor" viewBox="0 0 24 24">

                        <span class="sr-only">WhatsApp</span>
                        <svg class="size-6" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12.04 2C6.56 2 2.09 6.47 2.09 11.95c0 2.11.55 4.16 1.59 5.97L2 22l4.22-1.62a9.9 9.9 0 005.82 1.87h.01c5.48 0 9.95-4.47 9.95-9.95C22 6.47 17.52 2 12.04 2zm0 18.15c-1.8 0-3.57-.49-5.12-1.42l-.37-.22-2.5.96.97-2.43-.24-.38a8.2 8.2 0 01-1.26-4.39c0-4.52 3.68-8.2 8.2-8.2 2.19 0 4.25.85 5.8 2.4a8.15 8.15 0 012.4 5.8c0 4.52-3.68 8.2-8.2 8.2zm4.52-6.15c-.25-.12-1.46-.72-1.68-.8-.22-.08-.38-.12-.54.12-.16.25-.62.8-.76.96-.14.16-.28.18-.53.06-.25-.12-1.05-.39-2-1.25-.74-.66-1.24-1.47-1.38-1.72-.14-.25-.02-.38.1-.5.11-.11.25-.28.37-.42.12-.14.16-.25.25-.41.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.19-.46-.38-.4-.54-.41l-.46-.01c-.16 0-.42.06-.64.3-.22.25-.84.82-.84 2 0 1.18.86 2.32.98 2.48.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.1.16 1.52.1.46-.07 1.46-.6 1.66-1.18.21-.58.21-1.08.14-1.18-.06-.1-.22-.16-.46-.28z">

                    </a>
                </li>

                <li>
                    <a href="#" class="text-[#1DA1F2] transition hover:opacity-75">
                        <span class="sr-only">Twitter</span>
                        <svg class="size-6" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M8.29 20.251c7.547 0 11.675-6.253 11.675-11.675 0-.178 0-.355-.012-.53A8.348 8.348 0 0022 5.92a8.19 8.19 0 01-2.357.646 4.118 4.118 0 001.804-2.27 8.224 8.224 0 01-2.605.996 4.107 4.107 0 00-6.993 3.743 11.65 11.65 0 01-8.457-4.287 4.106 4.106 0 001.27 5.477A4.072 4.072 0 012.8 9.713v.052a4.105 4.105 0 003.292 4.022 4.095 4.095 0 01-1.853.07 4.108 4.108 0 003.834 2.85A8.233 8.233 0 012 18.407a11.616 11.616 0 006.29 1.84">

            </ul>
        </div>

        <div class="grid grid-cols-1 gap-8 border-t border-gray-100 pt-8 sm:grid-cols-2 lg:grid-cols-5 lg:pt-16">
            @for (item of enlaces; track item.nombre) {
            <div>
                <a [href]="item.link"
                    class="font-medium text-gray-900 transition hover:text-emerald-600 hover:underline">
                    {{ item.nombre }}
                </a>
            </div>
            }
        </div>

        <p class="text-xs text-gray-500">
            © {{ anio }}. Company Name. All rights reserved.
        </p>

    </div>
</footer>
